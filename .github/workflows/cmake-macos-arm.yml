name: CondaBuildMacOSARM64

on: [push]

permissions:
  contents: write

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  MACOSX_DEPLOYMENT_TARGET: 11.0
  CONDA_BUILD_SYSROOT: /Applications/Xcode_26.3.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
  SDKROOT: /Applications/Xcode_26.3.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
  GITHUB_WORKFLOW: CondaBuildMacOS

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/actions/configuring-and-managing-workflows/configuring-a-workflow#configuring-a-build-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-26"]
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.ref }}
        submodules: 'recursive'
    - name: Select current SDK
      run: |
        sudo xcode-select -s $(dirname $(dirname $(dirname $(dirname $(dirname $SDKROOT)))))
        echo "Xcode version selected:"
        xcodebuild -version
    - name: Compute env file hash (workaround for macos hashFiles bug)
      id: envhash
      shell: bash
      run: |
        h=$(shasum -a 256 .github/macos-environment-arm64.yml | awk '{print $1}')
        echo "hash=$h" >> "$GITHUB_OUTPUT"
    - name: Cache conda
      uses: actions/cache@v4
      env:
        # Increase this value to reset cache if etc/example-environment.yml has not changed
        CACHE_NUMBER: 1
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ steps.envhash.outputs.hash }}
    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: base
        channels: conda-forge
        auto-update-conda: false
    - name: Get conda prefix
      id: conda-prefix
      shell: bash
      run: echo "path=$CONDA" >> $GITHUB_OUTPUT
    - name: Cache conda base environment
      id: conda-env-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.conda-prefix.outputs.path }}
        key: ${{ runner.os }}-conda-env-1-${{ steps.envhash.outputs.hash }}
    - name: Install environment into base
      if: steps.conda-env-cache.outputs.cache-hit != 'true'
      shell: bash -el {0}
      working-directory: ${{github.workspace}}
      run: |
        echo "::group::Install environment into base"
        conda env update --name base -f .github/macos-environment-arm64.yml
        conda info
        conda list
        echo "::endgroup::"
    - name: Create .condarc file
      run: |
        conda config --show channels
        echo "channels:" > ~/.condarc
        echo "  - conda-forge" >> ~/.condarc
        echo "channel_priority: strict" >> ~/.condarc
        echo "default_channels: []" >> ~/.condarc
    - name: Verify .condarc content
      run: |
        cat ~/.condarc
    - name: Show Xcode SDK locations
      run: |
        echo "SDKROOT: $SDKROOT"
        ls -l /Applications/Xcode*.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/
        ls -l $SDKROOT
    - name: Show current conda channels
      run: conda config --show channels
    - name: Build
      shell: bash -l {0}
      working-directory: ${{github.workspace}}
      run: |
        echo "::group::Info"
        conda info
        conda search --override-channels -c conda-forge numpy
        conda list
        echo "::endgroup::"
        echo "::group::Fix Meta"
        cd $GITHUB_WORKSPACE/conda
        python select_config.py minimal --force
        p=${GITHUB_REF_NAME}
        p_sanitized=${p//\//_}
        p_sanitized=${p_sanitized//-/_}
        sed -i -e '/^{% set git_tag =/ s+{% set git_tag = "[^"]*" %}+{% set git_tag = "'"$p"'" %}+g' meta.yaml
        sed -i -e '/^{% set git_tag_sanitized =/ s+{% set git_tag_sanitized = "[^"]*" %}+{% set git_tag_sanitized = "'"$p_sanitized"'" %}+g' meta.yaml
        cat meta.yaml
        echo "::endgroup::"
        echo "::group::Fix PostLink"
        cat post-link.sh
        echo "::endgroup::"
        echo "::group::Build"
        conda update --all --override-channels -c conda-forge -y
        conda build . --override-channels -c conda-forge
        echo "::endgroup::"
        echo $CONDA_PREFIX
    - name: Test
      shell: bash -l {0}
      working-directory: ${{github.workspace}}
      run: |
        echo "::group::Test"
        echo $CONDA_PREFIX
        conda search --override-channels -c conda-forge numpy
        conda create -y -n test --override-channels -c $CONDA_PREFIX/conda-bld/ -c conda-forge trex
        conda activate test
        conda install -y git
        python $GITHUB_WORKSPACE/conda/validate_post_link_installation.py
        pvinfo -opencv_ffmpeg_support
        if pvinfo -opencv_opencl_support; then
          echo "Minimal OpenCV unexpectedly reports OpenCL support." >&2
          exit 1
        fi
        python $GITHUB_WORKSPACE/conda/validate_minimal.py
        trex_binary="$CONDA_PREFIX/bin/TRex.app/Contents/MacOS/TRex"
        linkage=$(otool -L "$trex_binary")
        echo "$linkage"
        for dependency in 'libopencv_(core|imgproc)' libpng libzip libavcodec; do
          line=$(echo "$linkage" | grep -E "$dependency" | head -n 1 || true)
          if [ -z "$line" ] || [[ "$line" != *"@rpath"* && "$line" != *"$CONDA_PREFIX"* ]]; then
            echo "Dependency '$dependency' does not use the installed Conda RPATH: $line" >&2
            exit 1
          fi
        done
        transitive_libraries=()
        while IFS= read -r linked_path; do
          linked_name=${linked_path#@rpath/}
          linked_library="$CONDA_PREFIX/lib/$linked_name"
          if [ -f "$linked_library" ]; then
            transitive_libraries+=("$linked_library")
          fi
        done < <(echo "$linkage" | awk '$1 ~ /^@rpath\// { print $1 }')
        if [ "${#transitive_libraries[@]}" -eq 0 ]; then
          echo "Could not resolve any direct Conda dylibs for transitive linkage inspection." >&2
          exit 1
        fi
        transitive_linkage=$(otool -L "${transitive_libraries[@]}")
        zlib_line=$(echo "$transitive_linkage" | grep -E 'libz\.' | head -n 1 || true)
        if [ -z "$zlib_line" ] || [[ "$zlib_line" != *"@rpath"* && "$zlib_line" != *"$CONDA_PREFIX"* ]]; then
          echo "Transitive zlib dependency does not use the installed Conda RPATH: $zlib_line" >&2
          exit 1
        fi
        rpaths=$(otool -l "$trex_binary" | awk '
          $1 == "cmd" && $2 == "LC_RPATH" { read_path = 1; next }
          read_path && $1 == "path" { print $2; read_path = 0 }
        ')
        echo "LC_RPATH entries:"
        printf '%s\n' "$rpaths"
        expected_rpath=$(cd "$CONDA_PREFIX/lib" && pwd -P)
        rpath_ok=false
        while IFS= read -r rpath; do
          [ -n "$rpath" ] || continue
          candidate=""
          case "$rpath" in
            /*) candidate="$rpath" ;;
            @loader_path|@loader_path/*)
              candidate="$(dirname "$trex_binary")/${rpath#@loader_path}"
              ;;
            @executable_path|@executable_path/*)
              candidate="$(dirname "$trex_binary")/${rpath#@executable_path}"
              ;;
          esac
          if [ -n "$candidate" ] && [ -d "$candidate" ]; then
            resolved_rpath=$(cd "$candidate" && pwd -P)
            if [ "$resolved_rpath" = "$expected_rpath" ]; then
              rpath_ok=true
              break
            fi
          fi
        done <<< "$rpaths"
        if [ "$rpath_ok" != true ]; then
          echo "TRex has no LC_RPATH resolving to the installed Conda lib directory: $expected_rpath" >&2
          exit 1
        fi
        echo "::endgroup::"
        echo "::group::TestFunctions"
        conda install -y unzip
        cd $GITHUB_WORKSPACE/Application/Tests
        ./run_unix.bash
        echo "::endgroup::"
    - name: Collect conda package artifacts
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      shell: bash -l {0}
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/conda-artifacts"
        mkdir -p "$out"
        packages=()
        while IFS= read -r -d '' pkg; do
          packages+=("$pkg")
        done < <(find "$CONDA_PREFIX/conda-bld" -type f -name 'trex-*.conda' -print0)
        if [ "${#packages[@]}" -eq 0 ]; then
          echo "No trex .conda packages found under $CONDA_PREFIX/conda-bld" >&2
          exit 1
        fi
        latest=$(ls -t "${packages[@]}" | head -n 1)
        cp "$latest" "$out/$(basename "$latest")"
        ls -lh "$out"
    - name: Upload conda packages
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: trex-conda-osx-arm64
        path: ${{ github.workspace }}/conda-artifacts/*.conda
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Attach conda packages to GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash -l {0}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="$GITHUB_REF_NAME"
        if ! gh release view "$tag" >/dev/null 2>&1; then
          gh release create "$tag" --verify-tag --title "$tag" --notes "Conda package builds for $tag." || gh release view "$tag" >/dev/null
        fi
        mkdir -p "$GITHUB_WORKSPACE/release-assets"
        zip -j "$GITHUB_WORKSPACE/release-assets/trex-conda-osx-arm64.zip" "$GITHUB_WORKSPACE"/conda-artifacts/*.conda
        gh release upload "$tag" "$GITHUB_WORKSPACE"/release-assets/*.zip --clobber
    - name: Upload failure artifacts (.csv, .npz, .results, .pv, logs, html, post-link logs)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64-failure-artifacts
        path: |
          ${{ github.workspace }}/videos/corrected/data/*.csv
          ${{ github.workspace }}/videos/**/*.html
          ${{ github.workspace }}/videos/**/*.log
          ${{ github.workspace }}/videos/**/*.npz
          ${{ github.workspace }}/videos/**/*.results
          ${{ github.workspace }}/videos/**/*.pv
          ${{ github.workspace }}/**/.messages.txt
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 9
