name: CondaBuildLinux

on: [push]

permissions:
  contents: write

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CONDA_BLD_PATH: ${{ github.workspace }}/conda-bld
  GITHUB_WORKFLOW: CondaBuildUbuntu
  MINIFORGE_VERSION: 26.5.3-0

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/actions/configuring-and-managing-workflows/configuring-a-workflow#configuring-a-build-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.ref }}
        submodules: 'recursive'
    - name: Cache conda
      uses: actions/cache@v4
      env:
        # Increase this value to reset cache if etc/example-environment.yml has not changed
        CACHE_NUMBER: 1
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-${{ runner.arch }}-conda-${{ env.MINIFORGE_VERSION }}-${{ env.CACHE_NUMBER }}-${{ hashFiles('.github/environment.yml') }}
    - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
      with:
        miniforge-version: ${{ env.MINIFORGE_VERSION }}
        environment-file: .github/environment.yml
        activate-environment: tracking
        channels: conda-forge
        conda-remove-defaults: true
        auto-update-conda: false
        pkgs-dirs: ~/conda_pkgs_dir
        use-only-tar-bz2: true
    - name: Verify isolated build environment
      run: |
        python_path=$(command -v python || true)
        conda_build_path=$(command -v conda-build || true)
        if [[ "${CONDA_DEFAULT_ENV:-}" != "tracking" || "$CONDA_PREFIX" == "$CONDA" \
              || "$python_path" != "$CONDA_PREFIX/bin/python" \
              || "$conda_build_path" != "$CONDA_PREFIX/bin/conda-build" ]]; then
          echo "Conda build tooling must run from the disposable tracking environment, not base." >&2
          echo "python: ${python_path:-missing}" >&2
          echo "conda-build: ${conda_build_path:-missing}" >&2
          exit 1
        fi
        conda info
        python --version
        conda-build --version
        python -c "import conda_index"
        conda list
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        sudo apt-get clean
    - name: Build
      working-directory: ${{github.workspace}}
      run: |
        echo "::group::Info"
        conda info
        echo $CONDA_DEFAULT_ENV
        conda list
        echo "::endgroup::"
        echo "::group::Fix Meta"
        cd $GITHUB_WORKSPACE/conda
        python select_config.py minimal --force
        p=${GITHUB_REF_NAME}
        p_sanitized=${p//\//_}
        p_sanitized=${p_sanitized//-/_}
        sed -i -e '/^{% set git_tag =/ s+{% set git_tag = "[^"]*" %}+{% set git_tag = "'"$p"'" %}+g' meta.yaml
        sed -i -e '/^{% set git_tag_sanitized =/ s+{% set git_tag_sanitized = "[^"]*" %}+{% set git_tag_sanitized = "'"$p_sanitized"'" %}+g' meta.yaml
        sed -i -e 's/_cuda[0-9.]*/\*/g' -e 's/_cudnn/\*/g' -e 's/_cu[0-9.]*/\*/g' meta.yaml
        cat meta.yaml
        echo "::endgroup::"
        echo "::group::Build"
        conda-build . --override-channels -c conda-forge
        echo "::endgroup::"
        echo $CONDA_PREFIX
    - name: Test
      working-directory: ${{github.workspace}}
      run: |
        echo "::group::Test"
        echo $CONDA_PREFIX
        python -m conda_index "$CONDA_BLD_PATH/"
        conda create -y -n test --override-channels -c "$CONDA_BLD_PATH/" -c conda-forge trex
        conda activate test
        python $GITHUB_WORKSPACE/conda/validate_post_link_installation.py
        pvinfo -opencv_ffmpeg_support
        if pvinfo -opencv_opencl_support; then
          echo "Minimal OpenCV unexpectedly reports OpenCL support." >&2
          exit 1
        fi
        python $GITHUB_WORKSPACE/conda/validate_minimal.py
        linkage=$(ldd "$(command -v trex)")
        echo "$linkage"
        for dependency in 'libopencv_(core|imgproc)' libpng libzip 'libz\.so' libavcodec; do
          line=$(echo "$linkage" | grep -E "$dependency" | head -n 1)
          if [ -z "$line" ] || [[ "$line" != *"$CONDA_PREFIX"* ]]; then
            echo "Dependency '$dependency' did not resolve from $CONDA_PREFIX: $line" >&2
            exit 1
          fi
        done
        if ! echo "$linkage" | grep -q 'libstdc++\.so'; then
          echo "TRex does not dynamically link libstdc++; a static runtime may be embedded." >&2
          exit 1
        fi
        echo "::endgroup::"
        echo "::group::TestFunctions"
        conda install -y -n test unzip
        cd $GITHUB_WORKSPACE/Application/Tests
        ./run_unix.bash
        echo "::endgroup::"
    - name: Collect conda package artifacts
      if: ${{ !cancelled() }}
      shell: bash --noprofile --norc -e -o pipefail {0}
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/conda-artifacts"
        mkdir -p "$out"
        packages=()
        if [ -d "$CONDA_BLD_PATH" ]; then
          while IFS= read -r -d '' pkg; do
            packages+=("$pkg")
          done < <(find "$CONDA_BLD_PATH" -type f -name 'trex-*.conda' -print0)
        fi
        if [ "${#packages[@]}" -eq 0 ]; then
          echo "No completed trex .conda package was available to upload." >&2
          exit 0
        fi
        latest=$(ls -t "${packages[@]}" | head -n 1)
        cp "$latest" "$out/$(basename "$latest")"
        ls -lh "$out"
    - name: Upload conda packages
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: trex-conda-linux-64
        path: ${{ github.workspace }}/conda-artifacts/*.conda
        if-no-files-found: ignore
        retention-days: 14
        compression-level: 0
    - name: Attach conda packages to GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="$GITHUB_REF_NAME"
        if ! gh release view "$tag" >/dev/null 2>&1; then
          gh release create "$tag" --verify-tag --title "$tag" --notes "Conda package builds for $tag." || gh release view "$tag" >/dev/null
        fi
        mkdir -p "$GITHUB_WORKSPACE/release-assets"
        zip -j "$GITHUB_WORKSPACE/release-assets/trex-conda-linux-64.zip" "$GITHUB_WORKSPACE"/conda-artifacts/*.conda
        gh release upload "$tag" "$GITHUB_WORKSPACE"/release-assets/*.zip --clobber
    - name: Upload failure artifacts (.csv, .npz, .results, .pv, logs, html, post-link logs)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: linux-failure-artifacts
        path: |
          ${{ github.workspace }}/videos/corrected/data/*.csv
          ${{ github.workspace }}/videos/**/*.html
          ${{ github.workspace }}/videos/**/*.log
          ${{ github.workspace }}/videos/**/*.npz
          ${{ github.workspace }}/videos/**/*.results
          ${{ github.workspace }}/videos/**/*.pv
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 9
